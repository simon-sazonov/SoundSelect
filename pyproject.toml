[project]
name = "soundselect"
version = "0.1.0"
description = "Alto sax toolkit: chord sheets, songs and sheet music written for your instrument"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "jinja2>=3.1",
    "verovio>=4.3",
    "weasyprint>=62",
]

[project.scripts]
soundselect = "soundselect.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/soundselect"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
filterwarnings = ["ignore:HarfBuzz-Subset:DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# Russian note names, ♯ and ♭ are intended in strings, comments and docstrings.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["soundselect"]
