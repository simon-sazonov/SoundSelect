[project]
name = "soundselect"
version = "0.1.0"
description = "Alto sax toolkit: chord sheets, songs and sheet music written for your instrument"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "jinja2>=3.1",
    "verovio>=4.3",
    "weasyprint>=62",
    "fastapi>=0.142",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "huey>=2.5",
    "pdfplumber>=0.11",
    "rapidocr>=3.9",
    "onnxruntime>=1.20",
    "opencv-python-headless>=4.10,<5",
    "pillow-heif>=1.0",
]

[project.optional-dependencies]
sheetmusic = ["homr>=0.7", "music21>=9.1"]
links = ["yt-dlp[default]>=2025.1"]
audio = ["av>=14"]

[project.scripts]
soundselect = "soundselect.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv]
override-dependencies = [
    # rapidocr asks for opencv-python, which beside homr's opencv-python-headless breaks homr:
    # everything uses the one OpenCV 4 above.
    "opencv-python; sys_platform == 'never'",
    # onnxruntime 1.24 and later has no Intel Mac wheels (homr asks for 1.24.1 or later).
    "onnxruntime>=1.20,<1.24; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "onnxruntime>=1.24.1; sys_platform != 'darwin' or platform_machine != 'x86_64'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/soundselect"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
filterwarnings = ["ignore:HarfBuzz-Subset:DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# Russian note names, ♯ and ♭ are intended in strings, comments and docstrings.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["soundselect"]
