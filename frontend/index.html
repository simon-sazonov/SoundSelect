<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F0EDE6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A1A19" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SoundSelect">
<title>SoundSelect</title>
<link rel="manifest" href="/app/manifest.webmanifest">
<link rel="icon" href="/app/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/app/icon-180.png">
<link rel="stylesheet" href="/music-font.css">
<link rel="stylesheet" href="/app/fonts/fonts.css">
<link rel="stylesheet" href="/app/styles.css">
<script>
  try { const t = localStorage.getItem("ss-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}
</script>
<script type="module" src="/app/app.js"></script>
</head>
<body>
<div class="shell">
  <nav class="nav" aria-label="Main">
    <a class="brand" href="/" aria-label="SoundSelect">
      <span class="brand-sax" data-art="saxSmall"></span>
      <span class="word">Sound<br>Select</span>
    </a>
    <a class="item" data-nav="import" href="/"><span data-ic="plus" data-s="20"></span>New import</a>
    <a class="item" data-nav="library" href="/library"><span data-ic="library" data-s="20"></span>Library</a>
    <a class="item" data-nav="batch" href="/" hidden><span data-ic="batch" data-s="20"></span><span>Last import</span></a>
    <a class="item" data-nav="song" href="/" hidden><span data-ic="note" data-s="20"></span><span>Song</span></a>
    <a class="item" data-nav="settings" href="/settings"><span data-ic="settings" data-s="20"></span>Settings</a>
    <div class="grow"></div>
    <div class="ver" id="ver"></div>
  </nav>
  <main id="main" tabindex="-1"><div class="loading">Loading…</div></main>
</div>
<nav class="tabbar" aria-label="Main">
  <a data-nav="import" href="/"><span data-ic="plus" data-s="22"></span>Import</a>
  <a data-nav="library" href="/library"><span data-ic="library" data-s="22"></span>Library</a>
  <a data-nav="settings" href="/settings"><span data-ic="settings" data-s="22"></span>Settings</a>
</nav>
<div id="stand-root"></div>
</body>
</html>
